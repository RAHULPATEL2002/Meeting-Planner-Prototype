[project]
name = "meeting-planner-backend"
version = "0.1.0"
description = "FastAPI + SQLite backend for the Meeting Planner prototype"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` be run from backend/ without installing the package.
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/Query() defaults are the documented style
